name: Apply V0.8 haptics and T9 patch

on:
  push:
    branches:
      - dev/v0.8-input-fixes
    paths:
      - .github/workflows/v08-haptics-t9-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.8-input-fixes
          fetch-depth: 0

      - name: Patch keyboard haptics and common T9 phrases
        shell: python
        run: |
          from pathlib import Path
          import re

          service = Path('app/src/main/java/com/jingwei/aikeyboard/JingweiImeService.java')
          text = service.read_text(encoding='utf-8')

          if 'import android.view.HapticFeedbackConstants;' not in text:
              text = text.replace(
                  'import android.view.KeyEvent;\n',
                  'import android.view.KeyEvent;\nimport android.view.HapticFeedbackConstants;\n',
                  1,
              )

          # Every normal keyboard Button produced by keyButton gets a gentle tap on ACTION_DOWN.
          # Returning false keeps all existing click / long-press behavior intact.
          if 'HapticFeedbackConstants.KEYBOARD_TAP' not in text:
              pattern = re.compile(r'(private\s+Button\s+keyButton\s*\(String\s+text\)\s*\{.*?)(\n\s*return\s+b\s*;\s*\n\s*\})', re.S)
              m = pattern.search(text)
              if not m:
                  raise RuntimeError('keyButton method not found')
              addition = '''\n        b.setHapticFeedbackEnabled(true);\n        b.setOnTouchListener((v, event) -> {\n            if (event.getAction() == MotionEvent.ACTION_DOWN) {\n                v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP);\n            }\n            return false;\n        });'''
              text = text[:m.start()] + m.group(1) + addition + m.group(2) + text[m.end():]

          service.write_text(text, encoding='utf-8')

          engine = Path('app/src/main/java/com/jingwei/aikeyboard/PinyinEngine.java')
          p = engine.read_text(encoding='utf-8')

          # Boost a small set of extremely common 9-key phrases so daily chat does not require manual splitting.
          if 'commonT9PhraseBoost' not in p:
              p = p.replace(
                  '        String d = cleanT9(digits);\n        if (d.isEmpty()) return Collections.emptyList();\n\n        List<T9State> decoded',
                  '        String d = cleanT9(digits);\n        if (d.isEmpty()) return Collections.emptyList();\n\n        List<String> boosted = commonT9PhraseBoost(d, limit);\n        if (!boosted.isEmpty()) return boosted;\n\n        List<T9State> decoded',
                  1,
              )

              marker = '    private String cleanT9(String digits) {'
              helper = '''    private List<String> commonT9PhraseBoost(String digits, int limit) {\n        List<String> out = new ArrayList<>();\n        if (\"64426\".equals(digits)) {\n            out.add(\"你好\");\n            out.add(\"你号\");\n        } else if (\"6442692\".equals(digits)) {\n            out.add(\"你好呀\");\n            out.add(\"你好哇\");\n        } else if (\"6442662\".equals(digits)) {\n            out.add(\"你好吗\");\n        } else if (\"42633\".equals(digits)) {\n            out.add(\"好的\");\n        } else if (\"5394\".equals(digits)) {\n            out.add(\"可以\");\n        } else if (\"943943\".equals(digits)) {\n            out.add(\"谢谢\");\n        } else if (\"9694432653\".equals(digits)) {\n            out.add(\"我知道了\");\n        }\n        if (out.isEmpty()) return Collections.emptyList();\n        int n = Math.min(Math.max(1, limit), out.size());\n        return new ArrayList<>(out.subList(0, n));\n    }\n\n'''
              if marker not in p:
                  raise RuntimeError('cleanT9 marker not found')
              p = p.replace(marker, helper + marker, 1)

          engine.write_text(p, encoding='utf-8')

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/v08-haptics-t9-patch.yml
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/jingwei/aikeyboard/JingweiImeService.java app/src/main/java/com/jingwei/aikeyboard/PinyinEngine.java .github/workflows/v08-haptics-t9-patch.yml
          git commit -m "feat: add keyboard haptics and smoother common T9 phrases"
          git push origin HEAD:dev/v0.8-input-fixes
