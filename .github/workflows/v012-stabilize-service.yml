name: V0.12 Stabilize Rime Service

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v0.12-rime
    paths:
      - '.github/workflows/v012-stabilize-service.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest V0.12
        uses: actions/checkout@v4
        with:
          ref: dev/v0.12-rime
          fetch-depth: 0

      - name: Apply service state fixes
        run: |
          echo '' | base64 -d > /tmp/stabilize.py
          python3 /tmp/stabilize.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Commit stabilized service
        run: |
          set -e
          git restore gradlew
          git config user.name 'Jingwei AI Dev Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/jingwei/aikeyboard/JingweiImeService.java app/build.gradle
          if git diff --cached --quiet; then
            echo 'Service stabilization already present.'
            exit 0
          fi
          git commit -m 'fix(v0.12): stabilize native candidate and mode state [skip ci]'
          git push origin HEAD:dev/v0.12-rime
