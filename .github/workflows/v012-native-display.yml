name: V0.12 Native Composition Display

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v0.12-rime
    paths:
      - 'tools/patch_v012_native_display.py'
      - '.github/workflows/v012-native-display.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply native composition display
        run: python3 tools/patch_v012_native_display.py
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Commit patch
        run: |
          git config user.name 'Jingwei AI Dev Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/jingwei/aikeyboard/JingweiImeService.java
          if git diff --cached --quiet; then
            echo 'No display changes to commit.'
            exit 0
          fi
          git commit -m 'fix(v0.12): show native Rime composition instead of legacy T9 guess [skip ci]'
          git pull --rebase origin dev/v0.12-rime
          git push origin HEAD:dev/v0.12-rime
