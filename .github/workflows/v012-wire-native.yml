name: V0.12 Wire Native Engine

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v0.12-rime
    paths:
      - 'tools/patch_v012_native_wiring.py'
      - 'app/src/main/java/com/jingwei/aikeyboard/RimeInputEngine.java'
      - '.github/workflows/v012-wire-native.yml'

permissions:
  contents: write

concurrency:
  group: v012-wire-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply deterministic V0.12 wiring
        run: python3 tools/patch_v012_native_wiring.py

      - name: Export Rime dictionary
        run: python3 tools/export_rime_dict.py

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Validate Android Java build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit generated wiring
        run: |
          git config user.name 'Jingwei AI Dev Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/jingwei/aikeyboard/JingweiImeService.java \
                  app/src/main/java/com/jingwei/aikeyboard/RimeRuntime.java \
                  app/src/main/cpp/rime_jni.cpp \
                  app/src/main/assets/rime/jingwei.dict.yaml
          if git diff --cached --quiet; then
            echo 'No wiring changes to commit.'
            exit 0
          fi
          git commit -m 'feat(v0.12): wire native Rime candidate path [skip ci]'
          git pull --rebase origin dev/v0.12-rime
          git push origin HEAD:dev/v0.12-rime
