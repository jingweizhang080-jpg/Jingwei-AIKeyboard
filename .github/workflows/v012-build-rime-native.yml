name: V0.12 Build Rime Native

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v0.12-rime
    paths:
      - 'app/src/main/cpp/**'
      - 'native/**'
      - 'tools/export_rime_dict.py'
      - 'app/src/main/assets/pinyin_lexicon.tsv'
      - '.github/workflows/v012-build-rime-native.yml'

permissions:
  contents: write

concurrency:
  group: v012-rime-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export Jingwei Rime dictionary
        run: python3 tools/export_rime_dict.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build arm64-v8a librime JNI
        working-directory: native
        run: |
          xmake f -p android -a arm64-v8a --ndk="$ANDROID_NDK_HOME" -m release -y
          xmake -y -vD
          find ../app/src/main/jniLibs -maxdepth 3 -type f -print || true

      - name: Verify rime_jni.so and required JNI symbols
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/librime_jni.so || test -f app/src/main/jniLibs/arm64-v8a/rime_jni.so
          if [ -f app/src/main/jniLibs/arm64-v8a/librime_jni.so ]; then
            mv app/src/main/jniLibs/arm64-v8a/librime_jni.so app/src/main/jniLibs/arm64-v8a/rime_jni.so
          fi
          SO=app/src/main/jniLibs/arm64-v8a/rime_jni.so
          ls -lh "$SO"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D "$SO" | grep 'Java_com_jingwei_aikeyboard_RimeBridge_nativeStart'
          "$NM" -D "$SO" | grep 'Java_com_jingwei_aikeyboard_RimeBridge_nativeSetSchema'
          "$NM" -D "$SO" | grep 'Java_com_jingwei_aikeyboard_RimeBridge_nativeProcessBackspace'
          "$NM" -D "$SO" | grep 'Java_com_jingwei_aikeyboard_RimeBridge_nativeGetInput'
          "$NM" -D "$SO" | grep 'Java_com_jingwei_aikeyboard_RimeBridge_nativeGetCandidates'

      - name: Commit generated Rime assets and native library safely
        run: |
          set -e
          cp app/src/main/jniLibs/arm64-v8a/rime_jni.so /tmp/rime_jni.so
          cp app/src/main/assets/rime/jingwei.dict.yaml /tmp/jingwei.dict.yaml
          git config user.name 'Jingwei AI Dev Bot'
          git config user.email 'actions@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "publish attempt $attempt"
            git fetch origin dev/v0.12-rime
            git reset --hard origin/dev/v0.12-rime
            mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/rime
            cp /tmp/rime_jni.so app/src/main/jniLibs/arm64-v8a/rime_jni.so
            cp /tmp/jingwei.dict.yaml app/src/main/assets/rime/jingwei.dict.yaml
            git add app/src/main/assets/rime/jingwei.dict.yaml app/src/main/jniLibs/arm64-v8a/rime_jni.so

            if git diff --cached --quiet; then
              echo 'Generated files already match the latest branch.'
              exit 0
            fi

            git commit -m 'build(v0.12): bundle verified Rime dictionary and arm64 engine [skip ci]'
            if git push origin HEAD:dev/v0.12-rime; then
              exit 0
            fi
            sleep 3
          done

          echo 'Failed to publish native library after 3 attempts.' >&2
          exit 1
