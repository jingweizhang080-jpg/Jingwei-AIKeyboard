name: Apply V0.10 input core

on:
  push:
    branches:
      - dev/v0.10-input-core
    paths:
      - '.github/workflows/apply-v010-input-core.yml'
      - '.github/scripts/apply_v010_input_core.py'

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[v0.10 patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.10-input-core
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply low-latency typing patch
        run: python .github/scripts/apply_v010_input_core.py
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "Jingwei AI Dev Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/jingwei/aikeyboard/JingweiImeService.java
          git commit -m "perf(v0.10): async pinyin pipeline and non-queued haptics [v0.10 patched]"
          git push origin HEAD:dev/v0.10-input-core
