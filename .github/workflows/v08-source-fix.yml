name: V0.8 source repair

on:
  push:
    branches:
      - dev/v0.8-input-fixes

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/v0.8-input-fixes
          fetch-depth: 0

      - name: Apply targeted V0.8 fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/jingwei/aikeyboard/JingweiImeService.java')
          text = path.read_text(encoding='utf-8')
          original = text

          # 1) Repair the corrupted import line that currently breaks Java compilation.
          text = text.replace(
              'import java.util.concurrent.Executors;import android.widget.Space;import android.widget.Spac\n',
              'import java.util.concurrent.Executors;\nimport android.widget.Space;\n'
          )

          # 2) Prevent the AI toolbar labels from wrapping/squeezing on narrow phones.
          text = text.replace('Button replyBtn = compactToolButton("💬 帮我回复");', 'Button replyBtn = compactToolButton("帮我回复");')
          text = text.replace('Button expressBtn = compactToolButton("✍ 帮我表达");', 'Button expressBtn = compactToolButton("帮我表达");')
          text = text.replace('top.addView(replyBtn, compactWeightParams(1.45f));', 'top.addView(replyBtn, compactWeightParams(1.25f));')
          text = text.replace('top.addView(expressBtn, compactWeightParams(1.45f));', 'top.addView(expressBtn, compactWeightParams(1.25f));')
          text = text.replace('top.addView(keyboardSwitch, new LinearLayout.LayoutParams(dp(42), dp(38)));', 'top.addView(keyboardSwitch, new LinearLayout.LayoutParams(dp(36), dp(38)));')
          text = text.replace('top.addView(aiPanelToggleButton, new LinearLayout.LayoutParams(dp(42), dp(38)));', 'top.addView(aiPanelToggleButton, new LinearLayout.LayoutParams(dp(34), dp(38)));')
          text = text.replace('top.addView(hideIme, new LinearLayout.LayoutParams(dp(38), dp(38)));', 'top.addView(hideIme, new LinearLayout.LayoutParams(dp(34), dp(38)));')

          old_compact = '''        b.setTextSize(13);\n        b.setTextColor(0xFF303038);\n        b.setAllCaps(false);\n        b.setMinHeight(0); b.setMinimumHeight(0);\n        b.setPadding(dp(4),0,dp(4),0);'''
          new_compact = '''        b.setTextSize(12);\n        b.setTextColor(0xFF303038);\n        b.setAllCaps(false);\n        b.setSingleLine(true);\n        b.setMinHeight(0); b.setMinimumHeight(0);\n        b.setMinWidth(0); b.setMinimumWidth(0);\n        b.setPadding(dp(2),0,dp(2),0);'''
          text = text.replace(old_compact, new_compact)

          # 3) Actually create the composition row that the existing candidate logic expects.
          marker = '''        // 候选词条：白色整条，减少割裂感。\n        LinearLayout candidateStrip = new LinearLayout(this);'''
          replacement = '''        // 拼音组合行：让正在输入的拼音和候选区连成一个整体。\n        composingRow = new LinearLayout(this);\n        composingRow.setOrientation(LinearLayout.HORIZONTAL);\n        composingRow.setGravity(Gravity.CENTER_VERTICAL);\n        composingRow.setVisibility(View.GONE);\n        composingRow.setPadding(dp(10), 0, dp(4), 0);\n        composingRow.setBackground(rounded(0xFFFFFFFF, 11, 0xFFE2E5EB));\n\n        composingText = label("", 13, false);\n        composingText.setTextColor(0xFF6A6E76);\n        composingText.setSingleLine(true);\n        composingRow.addView(composingText, new LinearLayout.LayoutParams(0, dp(28), 1f));\n\n        composingSplitButton = compactToolButton("分词");\n        composingSplitButton.setTextSize(11);\n        composingSplitButton.setOnClickListener(v -> handlePinyinSeparator());\n        composingRow.addView(composingSplitButton, new LinearLayout.LayoutParams(dp(48), dp(28)));\n        root.addView(composingRow, fullMargins(0,0,0,1));\n\n        // 候选词条：白色整条，减少割裂感。\n        LinearLayout candidateStrip = new LinearLayout(this);'''
          text = text.replace(marker, replacement)

          # 4) Allow longer continuous pinyin composition before refusing input.
          text = text.replace('if (pinyinBuffer.length() >= 32) return;', 'if (pinyinBuffer.length() >= 64) return;')

          if text == original:
              print('No source changes needed.')
          else:
              path.write_text(text, encoding='utf-8')
              print('Applied V0.8 source fixes.')

      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Jingwei AI Dev Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/jingwei/aikeyboard/JingweiImeService.java
          git commit -m "fix: stabilize keyboard layout and composition"
          git push origin HEAD:dev/v0.8-input-fixes
