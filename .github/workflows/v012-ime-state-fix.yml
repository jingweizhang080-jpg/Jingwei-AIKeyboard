name: V0.12 Fix IME Rime State

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v0.12-rime
    paths:
      - '.github/workflows/v012-ime-state-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest V0.12
        uses: actions/checkout@v4
        with:
          ref: dev/v0.12-rime
          fetch-depth: 0

      - name: Apply Rime single-source-of-truth fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/jingwei/aikeyboard/JingweiImeService.java')
          s = path.read_text(encoding='utf-8')

          replacements = [
              (
          '''        // Keep the old candidates on screen until the newest result is ready. This
                  // avoids flicker and makes typing feel continuous.
                  pinyinExecutor.execute(() -> {''',
          '''        // Never leave candidates from an older composition visible/clickable.
                  // Rime is the source of truth, so an outdated row is worse than a tiny refresh gap.
                  pinyinCandidatesBar.removeAllViews();
                  lastPinyinCandidates = new ArrayList<>();

                  pinyinExecutor.execute(() -> {'''
              ),
              (
          '''        InputConnection ic = getCurrentInputConnection();
                  if (ic != null) {
                      if (snapshotNineKey) {
                          if (!display.isEmpty()) ic.setComposingText(display, 1);
                      } else {
                          ic.setComposingText(snapshot, 1);
                      }
                  }''',
          '''        InputConnection ic = getCurrentInputConnection();
                  if (ic != null) {
                      String composingForEditor = useRime
                              ? display
                              : (snapshotNineKey ? display : snapshot);
                      if (!composingForEditor.isEmpty()) {
                          ic.setComposingText(composingForEditor, 1);
                      }
                  }'''
              ),
              (
          '''        ic.commitText(word, 1);
                  ic.finishComposingText();
                  pinyinGeneration.incrementAndGet();''',
          '''        ic.commitText(word, 1);
                  ic.finishComposingText();
                  // A committed editor word must also end the native Rime composition.
                  // Otherwise the next key is appended to the previous hidden session input.
                  if (rimeInputEngine != null && rimeInputEngine.isReady()) {
                      rimeInputEngine.reset();
                  }
                  pinyinGeneration.incrementAndGet();'''
              ),
              (
          '''        if (!lastPinyinCandidates.isEmpty()) {
                      commitPinyinCandidate(lastPinyinCandidates.get(0));
                  } else {''',
          '''        if (!lastPinyinCandidates.isEmpty()) {
                      if (rimeInputEngine != null && rimeInputEngine.isReady()) {
                          // Space selects Rime candidate #0 through Rime itself. Do not bypass
                          // the native session by committing only the visible String.
                          commitPinyinCandidate(lastPinyinCandidates.get(0), 0);
                      } else {
                          commitPinyinCandidate(lastPinyinCandidates.get(0));
                      }
                  } else {'''
              ),
              (
          '''            ic.commitText(raw, 1);
                      ic.finishComposingText();
                      pinyinBuffer = "";''',
          '''            ic.commitText(raw, 1);
                      ic.finishComposingText();
                      if (rimeInputEngine != null && rimeInputEngine.isReady()) {
                          rimeInputEngine.reset();
                      }
                      pinyinBuffer = "";'''
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
              elif new not in s:
                  raise SystemExit('Expected source block not found; refusing unsafe patch:\n' + old[:180])

          path.write_text(s, encoding='utf-8', newline='\n')
          print('IME state patch applied' if changed else 'IME state patch already present')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Java compile
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Commit fix
        run: |
          set -e
          git config user.name 'Jingwei AI Dev Bot'
          git config user.email 'actions@users.noreply.github.com'

          # Gradle may touch local metadata/cache files. Never let those block rebase.
          git add app/src/main/java/com/jingwei/aikeyboard/JingweiImeService.java
          if git diff --cached --quiet; then
            echo 'IME fix already present.'
            exit 0
          fi
          git commit -m 'fix(v0.12): make native Rime the committed input state [skip ci]'
          git reset --hard HEAD

          # Rebase once onto whatever other V0.12 automation published while compile ran.
          git fetch origin dev/v0.12-rime
          git rebase origin/dev/v0.12-rime
          git push origin HEAD:dev/v0.12-rime
