name: V0.12 APK Preview

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v0.12-rime
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/assets/rime/**'
      - 'app/src/main/jniLibs/**'
      - 'app/build.gradle'
      - 'app/src/main/AndroidManifest.xml'
      - '.github/workflows/v012-apk-preview.yml'

permissions:
  contents: read

concurrency:
  group: v012-apk-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare preinstalled Android SDK
        run: |
          set -e
          SDK_ROOT=/usr/local/lib/android/sdk
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Verify committed Rime native library
        run: |
          set -e
          test -f app/src/main/jniLibs/arm64-v8a/librime_jni.so
          test ! -f app/src/main/jniLibs/arm64-v8a/rime_jni.so

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug --no-daemon

      - name: Verify APK payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file():
              raise SystemExit(f"APK not found: {apk}")

          required = {
              "lib/arm64-v8a/librime_jni.so",
              "assets/rime/default.yaml",
              "assets/rime/jingwei_pinyin.schema.yaml",
              "assets/rime/jingwei_t9.schema.yaml",
              "assets/rime/jingwei.dict.yaml",
          }
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
          missing = required - names
          if missing:
              raise SystemExit("Missing from APK: " + ", ".join(sorted(missing)))
          if "lib/arm64-v8a/rime_jni.so" in names:
              raise SystemExit("Legacy wrong JNI filename is still packaged")
          print("APK payload verification passed")
          PY

      - name: Upload V0.12 APK
        uses: actions/upload-artifact@v4
        with:
          name: JingweiAIKeyboard-v0.12-rime-fast-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
