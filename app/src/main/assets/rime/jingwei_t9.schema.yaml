# Rime schema for Jingwei AI Keyboard 9-key pinyin
schema:
  schema_id: jingwei_t9
  name: 景威九键
  version: "0.12.2"
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier
translator:
  dictionary: jingwei
  prism: jingwei_t9
  enable_sentence: true
  enable_completion: true
  spelling_hints: 10
speller:
  # In native T9 mode the keyboard sends digits only. Convert every pinyin
  # letter deterministically to its phone-key digit when Rime builds the prism.
  # This avoids the old Java/beam-search path guessing a pinyin string first.
  alphabet: "98765432"
  initials: "98765432"
  delimiter: " '"
  algebra:
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/
key_binder:
  bindings:
    - { when: has_menu, accept: 1, send: apostrophe }
punctuator:
  half_shape:
    "1": [1, "@", ".", "/", ":", "_", "-", "#"]
