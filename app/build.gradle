plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jingwei.aikeyboard'
    compileSdk 35

    defaultConfig {
        applicationId "com.jingwei.aikeyboard"
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName "0.11.1-preview2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
